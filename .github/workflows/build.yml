name: Build and Release Launcher

on:
  push:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --force
        shell: bash

      - name: Get package version
        id: get_version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Windows certificate
        if: matrix.os == 'windows-latest'
        run: |
          CERT_FILE="$PWD/cert.pfx"
          echo "${{ secrets.CERT_PFX_B64 }}" | base64 -d > "$CERT_FILE"
          echo "CERT_PATH=$CERT_FILE" >> $GITHUB_ENV
          echo "CERT_PASS=${{ secrets.CERT_PASS }}" >> $GITHUB_ENV
        shell: bash

      - name: Build project
        run: |
          echo "Building version ${{ env.VERSION }} for ${{ matrix.os }}"
          npm run dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: release/${{ env.VERSION }}/*

  upload_release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/${{ needs.build.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: release/${{ needs.build.outputs.version }}/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
