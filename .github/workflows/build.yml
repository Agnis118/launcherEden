name: Build and Release Launcher

on:
    push:
        branches:
            - master
            - dev # pour tester sur la branche dev

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]

        timeout-minutes: 60

        steps:
            # 1️⃣ Checkout
            - name: Checkout repository
              uses: actions/checkout@v4

            # 2️⃣ Setup Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22 # Evite EBADENGINE

            # 3️⃣ Install dependencies (stable + optional deps pour mac)
            - name: Install dependencies
              run: |
                  npm ci --force
              shell: bash

            # 4️⃣ Get version from package.json
            - name: Get package version
              run: |
                  VERSION=$(node -p 'require("./package.json").version')
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
              shell: bash

            # 5️⃣ Create tag if not exists (Ubuntu job only)
            - name: Create tag if not exists
              if: matrix.os == 'ubuntu-latest'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch --tags
                  if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
                    echo "Tag v${{ env.VERSION }} already exists"
                  else
                    git tag -a "v${{ env.VERSION }}" -m "Release ${{ env.VERSION }}"
                    git push origin "v${{ env.VERSION }}"
                  fi

            # 6️⃣ Create GitHub release (Ubuntu job only)
            - name: Create release
              if: matrix.os == 'ubuntu-latest'
              uses: actions/create-release@v1
              id: create_release
              with:
                  tag_name: "v${{ env.VERSION }}"
                  release_name: "v${{ env.VERSION }}"
                  draft: false
                  prerelease: ${{ github.ref == 'refs/heads/dev' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            # 7️⃣ Build project selon OS
            - name: Build project
              run: |
                  echo "Building version ${{ env.VERSION }} for ${{ matrix.os }}"
                  if [ "${{ matrix.os }}" == "windows-latest" ]; then
                    npm run dist:win
                    mv dist/*.exe dist/PhyloriaLauncher-win-${{ env.VERSION }}.exe
                  elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
                    npm run dist:linux
                    mv dist/*.AppImage dist/PhyloriaLauncher-linux-${{ env.VERSION }}.AppImage
                  elif [ "${{ matrix.os }}" == "macos-latest" ]; then
                    npm run dist:mac
                    mv dist/*.dmg dist/PhyloriaLauncher-mac-${{ env.VERSION }}.dmg
                  fi
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            # 8️⃣ Upload release asset
            - name: Upload release asset
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/*.exe
                      dist/*.AppImage
                      dist/*.dmg
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
