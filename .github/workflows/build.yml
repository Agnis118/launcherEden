name: Build and Release Launcher

on:
    push:
        branches:
            - master
            - dev

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]
        timeout-minutes: 60
        outputs:
            version: ${{ steps.get_version.outputs.VERSION }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci --force
              shell: bash

            - name: Get package version
              id: get_version
              run: |
                  VERSION=$(node -p 'require("./package.json").version')
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
              shell: bash

            - name: Build project
              run: |
                  echo "Building version ${{ env.VERSION }} for ${{ matrix.os }}"
                  if [ "${{ matrix.os }}" == "windows-latest" ]; then
                    npm run dist:win
                    mv release/${{ env.VERSION }}/*.exe dist/PhyloriaLauncher-win-${{ env.VERSION }}.exe
                  elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
                    npm run dist:linux
                    mv release/${{ env.VERSION }}/*.AppImage dist/PhyloriaLauncher-linux-${{ env.VERSION }}.AppImage
                  elif [ "${{ matrix.os }}" == "macos-latest" ]; then
                    npm run dist:mac
                    mv release/${{ env.VERSION }}/*.dmg dist/PhyloriaLauncher-mac-${{ env.VERSION }}.dmg
                  fi
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: launcher-${{ matrix.os }}
                  path: dist/*

    upload_release:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Create tag if not exists
              run: |
                  TAG="v${{ needs.build.outputs.version }}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch --tags
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists"
                  else
                    git tag -a "$TAG" -m "Release $TAG"
                    git push origin "$TAG"
                  fi
                  echo "TAG=$TAG" >> $GITHUB_ENV

            - name: Download Windows artifact
              uses: actions/download-artifact@v4
              with:
                  name: launcher-windows-latest
                  path: dist/
            - name: Download Linux artifact
              uses: actions/download-artifact@v4
              with:
                  name: launcher-ubuntu-latest
                  path: dist/
            - name: Download Mac artifact
              uses: actions/download-artifact@v4
              with:
                  name: launcher-macos-latest
                  path: dist/

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.TAG }}
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
