name: Build and Release Launcher

on:
    push:
        branches:
            - master
            - dev

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]

        steps:
            # 1️⃣ Checkout
            - name: Checkout repository
              uses: actions/checkout@v4

            # 2️⃣ Setup Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            # 3️⃣ Install dependencies
            - name: Install dependencies
              run: npm install

            # 4️⃣ Get version from package.json
            - name: Get package version
              id: vars
              run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_ENV

            # 5️⃣ Create tag if not exists (only once, on first job)
            - name: Create tag if not exists
              if: matrix.os == 'ubuntu-latest' # on choisit un OS pour créer le tag
              run: |
                  if git rev-parse "v$VERSION" >/dev/null 2>&1; then
                    echo "Tag v$VERSION already exists"
                  else
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git tag -a "v$VERSION" -m "Release $VERSION"
                    git push origin "v$VERSION"

            # 6️⃣ Create GitHub release (only once, on first job)
            - name: Create release
              if: matrix.os == 'ubuntu-latest'
              uses: actions/create-release@v1
              id: create_release
              with:
                  tag_name: "v${{ env.VERSION }}"
                  release_name: "v${{ env.VERSION }}"
                  draft: false
                  prerelease: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # 7️⃣ Build selon l'OS
            - name: Build project
              run: |
                  echo "Building version $VERSION for ${{ matrix.os }}"
                  if [ "${{ matrix.os }}" == "windows-latest" ]; then
                    npm run dist:win
                    mv dist/*.exe dist/PhyloriaLauncher-win-$VERSION.exe
                  elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
                    npm run dist:linux
                    mv dist/*.AppImage dist/PhyloriaLauncher-linux-$VERSION.AppImage
                  elif [ "${{ matrix.os }}" == "macos-latest" ]; then
                    npm run dist:mac
                    mv dist/*.dmg dist/PhyloriaLauncher-mac-$VERSION.dmg

            # 8️⃣ Upload des assets (chaque job upload son fichier)
            - name: Upload release asset
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/*.exe
                      dist/*.AppImage
                      dist/*.dmg
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
